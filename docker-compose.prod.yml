services:
  api:
    image: ${DOCKER_IMAGE:-ghcr.io/wikramawardana/dapur-buwikra-be}:${DOCKER_TAG:-latest}
    container_name: dapur-buwikra-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8000
      - DATABASE_URL=${DATABASE_URL}
      - SURREAL_DB_URL=${SURREAL_DB_URL}
      - SURREAL_DB_USER=${SURREAL_DB_USER}
      - SURREAL_DB_PASS=${SURREAL_DB_PASS}
      - SURREAL_DB_NS=${SURREAL_DB_NS}
      - SURREAL_DB_DB=${SURREAL_DB_DB}
      - UPLOAD_DIR=${UPLOAD_DIR}
      - FRONTEND_URL=${FRONTEND_URL}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
