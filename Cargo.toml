[package]
name = "expense-tracker-be"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
axum = "0.7"
axum-extra = { version = "0.9", features = ["typed-header", "multipart"] }
tokio = { version = "1.35", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
axum-prometheus = "0.6.1"

# Database (SurrealDB) - Main data store
surrealdb = { version = "3.0.4", default-features = false, features = [
    "protocol-http",
    "protocol-ws",
    "http",
    "rustls",
] }

# PostgreSQL - For auth/session verification (Better Auth)
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono"] }

# TLS - use ring as the crypto provider
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.6", features = ["v4", "serde"] }

# Hashing (API key storage)
sha2 = "0.10"
hex = "0.4"

# Validation
validator = { version = "0.18", features = ["derive"] }

# Configuration
dotenv = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"
figlet-rs = "0.1.5"

# Async utilities
async-trait = "0.1"
