name: Build and Deploy Backend

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-gitops:
    name: Update GitOps
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Update image tag in GitOps repo
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          git clone https://x-access-token:${GITOPS_TOKEN}@github.com/wikramawardana/wikra-gitops.git
          cd wikra-gitops
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sed -i "s|newTag:.*|newTag: ${SHORT_SHA}|" manifests/expense-tracker-be/overlays/prod/kustomization.yaml
          git add manifests/expense-tracker-be/overlays/prod/kustomization.yaml
          git diff --staged --quiet || git commit -m "deploy expense-tracker-be ${SHORT_SHA}"
          git push

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    environment: production
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Copy MCP server to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "mcp/server.py,mcp/README.md"
          target: "/home/wikra/production-projects/expense-tracker"
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /home/wikra/production-projects
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull expense-tracker-api
            docker compose up -d expense-tracker-api
            docker image prune -f
            if [ -f /home/wikra/production-projects/expense-tracker/mcp/server.py ]; then
              chmod 700 /home/wikra/production-projects/expense-tracker/mcp/server.py
              /home/wikra/.hermes/hermes-agent/venv/bin/python -m py_compile /home/wikra/production-projects/expense-tracker/mcp/server.py
              if systemctl --user is-active --quiet hermes-gateway-wikrassist-expense.service; then
                systemctl --user restart hermes-gateway-wikrassist-expense.service || true
              fi
            fi

  health-check:
    name: Health Check
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Wait for startup
        run: sleep 30

      - name: Check API health
        run: curl -f https://api-expensetracker.wikra.cloud/api/v1/health || echo "Health check failed"
